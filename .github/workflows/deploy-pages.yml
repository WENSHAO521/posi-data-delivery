name: Deploy data layer

# Publishes https://data.posi.panorama-sg.com with GitHub Pages ("Source:
# GitHub Actions" in Settings > Pages). The site is assembled on each deploy
# (scripts/assemble-pages.mjs) from this repository (current.json, releases,
# snapshots) and the POSI website's data files, which its
# publish-site-data workflow uploads to its `site-data` release; they are
# served at /site/v1/. The website's data is therefore not committed here,
# and this repository does not grow with it.
#
# Deploys on a push to main or a dispatch; after each snapshot check (Sync
# snapshot from posi-data) and every 20 minutes, it deploys only when this
# repository's main or the site data differ from the live deploy.json. Downloads from GitHub retry,
# fall back to the API, and then to the site data cached by an earlier run (see the steps below), so a
# GitHub 504 does not fail the deploy.

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ['Sync snapshot from posi-data']
    types: [completed]
  schedule:
    - cron: '4,24,44 * * * *'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORMAT: v1
  SITE_DATA: https://github.com/WENSHAO521/Panorama-Open-Scholarly-Index/releases/download/site-data

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          path: repo

      # Downloads go through scripts/get-site-data.sh (retries with backoff, then the GitHub API), so a
      # GitHub 504 rarely fails a run. If GitHub stays down, a scheduled check skips (the live deploy
      # stays and the next check in 20 minutes tries again), and a push or dispatch deploys with the last
      # site data this workflow cached.
      - name: Decide whether to deploy
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! repo/scripts/get-site-data.sh "site-data-$FORMAT.json" stamp.json; then
            case "${{ github.event_name }}" in
              schedule|workflow_run)
                echo "::warning::GitHub is not serving the site data stamp; skipping this check, the live deploy stays"
                echo "GitHub did not serve the site data stamp; check skipped, the live deploy stays" >> "$GITHUB_STEP_SUMMARY"
                echo "deploy=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
            esac
            echo "::warning::GitHub is not serving the site data stamp; deploying with the cached site data"
            echo "deploy=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # The archive is identified by commit and build time: posi-engine's daily OpenAlex refresh
          # republishes it for the same commit (new article counts and citations), which is a change too.
          build=$(node -p "const s=require('./stamp.json'); s.commit+'@'+s.built_at")
          echo "build=$(printf '%s' "$build" | tr ':' '-')" >> "$GITHUB_OUTPUT"
          echo "commit=$(node -p "require('./stamp.json').commit")" >> "$GITHUB_OUTPUT"
          # Ranking archives are releases, not commits: a new one also means a deploy.
          rankings=$(gh release list -R "$GITHUB_REPOSITORY" --limit 1000 --json tagName,isDraft --jq '[.[] | select(.isDraft | not) | .tagName | select(test("^ranking-"))] | sort | join(",")')
          next="$GITHUB_SHA $build $rankings"
          live=$(curl -fsSL --retry 2 https://data.posi.panorama-sg.com/deploy.json 2>/dev/null | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const j=JSON.parse(s);console.log(j.delivery_commit+' '+j.site_data.commit+'@'+j.site_data.built_at+' '+[...(j.ranking_editions_all??[])].sort().join(','))}catch{console.log('')}})" || true)
          case "${{ github.event_name }}" in
            schedule|workflow_run)
              if [ "$next" = "$live" ]; then
                echo "This repository and the site data are already live ($next); nothing to deploy" | tee -a "$GITHUB_STEP_SUMMARY"
                echo "deploy=false" >> "$GITHUB_OUTPUT"; exit 0
              fi ;;
          esac
          echo "deploy=true" >> "$GITHUB_OUTPUT"

      # The site data of the stamp's commit, if an earlier run cached it (no 200 MB download then), else
      # the newest cached copy, used only if GitHub does not serve the archive.
      - name: Restore cached site data
        id: cache
        if: steps.decide.outputs.deploy == 'true'
        uses: actions/cache/restore@v5
        with:
          path: site-cache
          key: site-data-${{ env.FORMAT }}-${{ steps.decide.outputs.build || 'unknown' }}
          restore-keys: site-data-${{ env.FORMAT }}-

      # Snapshot collections and ranking archives, cached by SHA-256 (scripts/assemble-pages.mjs): each
      # downloads once, and a GitHub outage cannot fail a deploy for a file an earlier run had.
      - name: Restore cached release assets
        if: steps.decide.outputs.deploy == 'true'
        uses: actions/cache/restore@v5
        with:
          path: asset-cache
          key: release-assets-${{ github.run_id }}
          restore-keys: release-assets-

      - name: Assemble
        id: assemble
        if: steps.decide.outputs.deploy == 'true'
        working-directory: repo
        env:
          GH_TOKEN: ${{ github.token }}
          POSI_ASSET_CACHE: ${{ github.workspace }}/asset-cache
        run: |
          set -euo pipefail
          if [ "${{ steps.cache.outputs.cache-hit }}" = "true" ]; then
            echo "Site data ${{ steps.decide.outputs.build }} from the cache"
            cp ../site-cache/stamp.json ../stamp.json
          elif [ -n "${{ steps.decide.outputs.build }}" ] && scripts/get-site-data.sh "site-data-$FORMAT.tar.gz" ../site-data.tar.gz; then
            # The stamp read in the decide step names this archive; if the archive was replaced in
            # between, the newer stamp differs from the deployed one and the next check deploys again.
            mkdir -p ../site-cache && mv ../site-data.tar.gz ../site-cache/site-data.tar.gz && cp ../stamp.json ../site-cache/stamp.json
            echo "save=true" >> "$GITHUB_OUTPUT"
          elif [ -f ../site-cache/site-data.tar.gz ]; then
            cp ../site-cache/stamp.json ../stamp.json
            echo "::warning::GitHub did not serve the site data; deploying the cached copy built from $(node -p "require('../stamp.json').commit")"
          else
            echo "::error::GitHub did not serve the site data and no cached copy exists"; exit 1
          fi
          mkdir -p ../site-data && tar -xzf ../site-cache/site-data.tar.gz -C ../site-data
          node scripts/assemble-pages.mjs ../site-data ../stamp.json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Cache release assets
        if: steps.decide.outputs.deploy == 'true' && hashFiles('asset-cache/*') != ''
        uses: actions/cache/save@v5
        with:
          path: asset-cache
          key: release-assets-${{ hashFiles('asset-cache/*') }}

      - name: Cache site data
        if: steps.assemble.outputs.save == 'true'
        uses: actions/cache/save@v5
        with:
          path: site-cache
          key: site-data-${{ env.FORMAT }}-${{ steps.decide.outputs.build }}

      - uses: actions/configure-pages@v6
        if: steps.decide.outputs.deploy == 'true'

      - uses: actions/upload-pages-artifact@v5
        if: steps.decide.outputs.deploy == 'true'
        with:
          path: repo/_site
          include-hidden-files: true   # v3 kept dotfiles (.nojekyll); v4+ drops them unless asked

      - name: Deploy
        id: deployment
        if: steps.decide.outputs.deploy == 'true'
        uses: actions/deploy-pages@v5

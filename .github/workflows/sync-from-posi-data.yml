name: Sync snapshot from posi-data

# Builds a new data snapshot from posi-data (public) whenever posi-data's
# published data has changed since the current snapshot, using posi-data's own
# scripts/publish-data-snapshot.mjs. Writes only to this repository, with its
# own token. Snapshots are immutable: a second snapshot on the same day gets
# the next free id (YYYY-MM-DD-2, -3, ...).
#
# It checks every 20 minutes, 6 minutes after posi-data's import-global-index,
# so new data is published within minutes rather than hours. GitHub delays
# scheduled runs and sometimes drops them, so frequent checks are also what
# makes the chain dependable. A check with nothing new exits in seconds. "Changed" means the collection files differ (their
# SHA-256 against the current snapshot's SHA256SUMS), so a documentation-only
# commit in posi-data publishes nothing.
#
# Snapshot data is not kept in git: each snapshot's collection files go to a
# GitHub release, snapshot-<id> (scripts/release-snapshots.sh), and only its
# manifest.json and SHA256SUMS are committed. The Pages deploy downloads what
# it serves from those releases.
#
# Each year's Citation Ranking edition is archived the same way, frozen, as
# the release ranking-<year> (a later change to that year's edition becomes
# ranking-<year>-r1, -r2 ...; scripts/release-rankings.sh), and the Pages
# deploy serves the newest archive of every year under /downloads/rankings/.

on:
  schedule:
    - cron: '8,28,48 * * * *'   # every 20 minutes, 6 minutes after posi-data's import
  workflow_dispatch:

concurrency:
  group: sync-from-posi-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check out posi-data
        uses: actions/checkout@v4
        with:
          repository: WENSHAO521/posi-data
          path: _posi-data

      - name: Decide whether a new snapshot is needed
        id: decide
        run: |
          set -euo pipefail
          DATA_SHA=$(git -C _posi-data rev-parse HEAD)
          # Collection checksums posi-data would publish now, against the current snapshot's.
          (cd _posi-data && node scripts/publish-data-snapshot.mjs --checksums-only) > "$RUNNER_TEMP/next.json"
          CHANGED=$(node scripts/collections-changed.mjs "$RUNNER_TEMP/next.json")
          if [ "$CHANGED" = "no" ]; then
            echo "posi-data $DATA_SHA: collections unchanged since $(node -p "require('./current.json').snapshot"); nothing to publish" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ID=$(date -u +%Y-%m-%d); N=1
          while [ -d "snapshots/$ID" ]; do N=$((N+1)); ID="$(date -u +%Y-%m-%d)-$N"; done
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "engine=$(git ls-remote https://github.com/WENSHAO521/posi-engine HEAD | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Build snapshot
        if: steps.decide.outputs.publish == 'true'
        working-directory: _posi-data
        run: node scripts/publish-data-snapshot.mjs --out .. --snapshot-id ${{ steps.decide.outputs.id }} --engine-commit ${{ steps.decide.outputs.engine }}

      - name: Move snapshot data to releases
        # Every run, so a snapshot whose earlier move failed is retried.
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release-snapshots.sh | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Archive the Citation Ranking edition
        # Every run: publishes ranking-<year> (or a revision) only when the
        # current snapshot holds an edition no archive holds yet.
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release-rankings.sh | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Commit
        run: |
          rm -rf _posi-data
          git config user.name  "posi-delivery-bot"
          git config user.email "posi-delivery-bot@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then exit 0; fi
          if [ "${{ steps.decide.outputs.publish }}" = "true" ]; then
            git commit -m "Publish snapshot ${{ steps.decide.outputs.id }}"
            echo "Published snapshot ${{ steps.decide.outputs.id }}: $(node -p "const c=require('./current.json');c.type+(c.release?' '+c.release:'')")" >> "$GITHUB_STEP_SUMMARY"
          else
            git commit -m "Move snapshot data to releases"
          fi
          git push
